name: Windows Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names (for example v0.1.0-rc1)"
        required: true
        default: "manual"
      publish_release:
        description: "Publish a GitHub Release. Only works for tag refs."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-release-candidate:
    name: Build Windows release candidate
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CGO_ENABLED: "1"
      CC: gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            "VERSION=$env:GITHUB_REF_NAME" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          }
          else {
            "VERSION=${{ inputs.version }}" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true
          cache-dependency-path: |
            GUI/go.sum
            CLI/go.sum

      - name: Setup MinGW for Fyne/cgo
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download GUI modules
        shell: pwsh
        run: |
          Push-Location GUI
          try {
            go mod download
          }
          finally {
            Pop-Location
          }

      - name: Download CLI modules
        shell: pwsh
        run: |
          Push-Location CLI
          try {
            go mod download
          }
          finally {
            Pop-Location
          }

      - name: Check Go formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path GUI,CLI -Recurse -Filter *.go |
            ForEach-Object { $_.FullName }

          $unformatted = @(gofmt -l $files)

          if ($unformatted.Count -gt 0) {
            Write-Error "Go files need formatting:`n$($unformatted -join "`n")"
          }

      - name: Test GUI
        shell: pwsh
        run: |
          Push-Location GUI
          try {
            go test -v ./...
          }
          finally {
            Pop-Location
          }

      - name: Test CLI
        shell: pwsh
        run: |
          Push-Location CLI
          try {
            go test -v ./...
          }
          finally {
            Pop-Location
          }

      - name: Vet GUI
        shell: pwsh
        run: |
          Push-Location GUI
          try {
            go vet ./...
          }
          finally {
            Pop-Location
          }

      - name: Vet CLI
        shell: pwsh
        run: |
          Push-Location CLI
          try {
            go vet ./...
          }
          finally {
            Pop-Location
          }

      - name: Build release layout
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1 `
            -Version $env:VERSION `
            -OutDir dist

      - name: Verify release layout
        shell: pwsh
        run: |
          $required = @(
            "dist\AdbPureFlow-$env:VERSION-windows-amd64.exe",
            "dist\checksums-$env:VERSION.txt",
            "dist\README-WINDOWS.txt"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing release file: $path"
            }
          }

          Get-Content "dist\checksums-$env:VERSION.txt"

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdbPureFlow-${{ env.VERSION }}-windows-amd64
          path: |
            dist/AdbPureFlow-${{ env.VERSION }}-windows-amd64.exe
            dist/checksums-${{ env.VERSION }}.txt
            dist/README-WINDOWS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/v') &&
          (
            github.event_name == 'push' ||
            inputs.publish_release == true
          )
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AdbPureFlow-${{ env.VERSION }}-windows-amd64.exe
            dist/checksums-${{ env.VERSION }}.txt
            dist/README-WINDOWS.txt
          generate_release_notes: true
