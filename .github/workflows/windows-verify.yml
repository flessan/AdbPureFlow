name: Windows Verification

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-gui-and-cli:
    name: Windows GUI/CLI build and tests
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CGO_ENABLED: "1"
      CC: gcc
      VERSION: ci-${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Windows console popup fix
        shell: pwsh
        run: |
          $app = "GUI\app.go"
          $text = Get-Content -Raw -Encoding UTF8 $app
          $needle = 'cmd := exec.CommandContext(ctx, executable, args...)'
          $count = ([regex]::Matches($text, [regex]::Escape($needle))).Count
          if ($count -ne 3) {
            throw "Expected 3 OSRunner command sites, found $count"
          }

          $replacement = $needle + "`r`n`tconfigureCommand(cmd)"
          $offset = 0
          for ($i = 0; $i -lt 3; $i++) {
            $index = $text.IndexOf($needle, $offset, [StringComparison]::Ordinal)
            if ($index -lt 0) { throw "Could not locate OSRunner command site $($i + 1)" }
            $text = $text.Substring(0, $index) + $replacement + $text.Substring($index + $needle.Length)
            $offset = $index + $replacement.Length
          }

          $capture = 'cmd := exec.CommandContext(ctx, adb, "-s", serial, "exec-out", "screencap", "-p")'
          $captureIndex = $text.IndexOf($capture, [StringComparison]::Ordinal)
          if ($captureIndex -lt 0) { throw "CaptureScreenshot command not found" }
          if ($text.IndexOf("configureCommand(cmd)", $captureIndex, [StringComparison]::Ordinal) -lt 0) {
            $captureReplacement = $capture + "`r`n`tconfigureCommand(cmd)"
            $text = $text.Substring(0, $captureIndex) + $captureReplacement + $text.Substring($captureIndex + $capture.Length)
          }
          Set-Content -Path $app -Value $text -Encoding UTF8 -NoNewline

          @'
          //go:build windows

          package main

          import (
          	"os/exec"
          	"syscall"
          )

          // configureCommand prevents console-based helper processes such as adb.exe
          // from flashing a transient console window when launched by the GUI app.
          func configureCommand(cmd *exec.Cmd) {
          	if cmd == nil {
          		return
          	}
          	cmd.SysProcAttr = &syscall.SysProcAttr{HideWindow: true}
          }
          '@ | Set-Content -Path "GUI\process_windows.go" -Encoding UTF8 -NoNewline

          @'
          //go:build !windows

          package main

          import "os/exec"

          func configureCommand(cmd *exec.Cmd) {}
          '@ | Set-Content -Path "GUI\process_other.go" -Encoding UTF8 -NoNewline

          @'
          //go:build windows

          package main

          import (
          	"os/exec"
          	"testing"
          )

          func TestConfigureCommandHidesWindowsWindow(t *testing.T) {
          	cmd := exec.Command("cmd.exe", "/c", "exit", "0")
          	configureCommand(cmd)
          	if cmd.SysProcAttr == nil {
          		t.Fatal("expected Windows process attributes")
          	}
          	if !cmd.SysProcAttr.HideWindow {
          		t.Fatal("expected child console window to be hidden")
          	}
          }
          '@ | Set-Content -Path "GUI\process_windows_test.go" -Encoding UTF8 -NoNewline

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: |
            GUI/go.sum
            CLI/go.sum

      - name: Setup MinGW for Fyne/cgo
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download GUI modules
        shell: pwsh
        run: |
          Push-Location GUI
          try { go mod download }
          finally { Pop-Location }

      - name: Download CLI modules
        shell: pwsh
        run: |
          Push-Location CLI
          try { go mod download }
          finally { Pop-Location }

      - name: Check Go formatting
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path GUI,CLI -Recurse -Filter *.go | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { exit 0 }
          $before = git diff --binary -- $files
          gofmt -w $files
          $after = git diff --binary -- $files
          if ($before -ne $after) {
            Write-Error "Go files are not gofmt-clean:"
            git diff -- $files
            exit 1
          }

      - name: Test GUI
        shell: pwsh
        run: |
          Push-Location GUI
          try { go test -v ./... }
          finally { Pop-Location }

      - name: Test CLI
        shell: pwsh
        run: |
          Push-Location CLI
          try { go test -v ./... }
          finally { Pop-Location }

      - name: Vet GUI
        shell: pwsh
        run: |
          Push-Location GUI
          try { go vet ./... }
          finally { Pop-Location }

      - name: Vet CLI
        shell: pwsh
        run: |
          Push-Location CLI
          try { go vet ./... }
          finally { Pop-Location }

      - name: Build Windows executable and checksum
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1 `
            -Version $env:VERSION `
            -OutDir dist

      - name: Verify release files
        shell: pwsh
        run: |
          $exe = "dist\AdbPureFlow-$env:VERSION-windows-amd64.exe"
          $checksums = "dist\checksums-$env:VERSION.txt"
          $readme = "dist\README-WINDOWS.txt"
          if (-not (Test-Path $exe)) { throw "Missing executable: $exe" }
          if (-not (Test-Path $checksums)) { throw "Missing checksum file: $checksums" }
          if (-not (Test-Path $readme)) { throw "Missing Windows readme: $readme" }
          $expected = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = Get-Content $checksums | Select-String -SimpleMatch (Split-Path $exe -Leaf) | Select-Object -First 1
          if (-not $checksumLine) { throw "No checksum entry found for $exe" }
          $actual = $checksumLine.ToString().Trim().Split([char[]]@(' ', "`t"), [System.StringSplitOptions]::RemoveEmptyEntries)[0].ToLowerInvariant()
          if ($expected -ne $actual) { throw "Checksum mismatch for $exe" }

      - name: Commit source fix and remove temporary workflow
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($status)) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GUI\app.go GUI\process_windows.go GUI\process_other.go GUI\process_windows_test.go
          if (Test-Path ".github\workflows\apply-console-popup-fix.yml") { git rm ".github\workflows\apply-console-popup-fix.yml" }
          git commit -m "Fix Windows console popup from helper processes"
          git push origin HEAD:main

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdbPureFlow-${{ env.VERSION }}-windows-amd64
          path: |
            dist/AdbPureFlow-${{ env.VERSION }}-windows-amd64.exe
            dist/checksums-${{ env.VERSION }}.txt
            dist/README-WINDOWS.txt
          if-no-files-found: error
