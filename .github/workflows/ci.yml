name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - arena/*
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

# =====================================
# LINT
# =====================================

  lint-and-format:

    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: |
            CLI/go.sum
            GUI/go.sum


      - name: Install Fyne dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libxxf86vm-dev


      - name: Format Check
        run: |

          gofmt -w CLI GUI

          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted"
            git diff
            exit 1
          fi


      - name: Vet CLI
        run: |
          cd CLI
          go vet ./...


      - name: Vet GUI
        run: |
          cd GUI
          go vet ./...



# =====================================
# TEST
# =====================================

  test-suite:

    name: Unit Tests
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: |
            CLI/go.sum
            GUI/go.sum


      - name: Install Fyne dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libxxf86vm-dev


      - name: Test CLI
        run: |
          cd CLI
          go test -v -race ./...


      - name: Test GUI
        run: |
          cd GUI
          go test -v -race ./...



# =====================================
# BUILD
# =====================================

  multi-platform-build:

    name: Build Multi Platform
    needs:
      - lint-and-format
      - test-suite


    strategy:

      fail-fast: false

      matrix:

        include:


          # ===================
          # CLI
          # ===================

          - name: cli-windows
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"


          - name: cli-linux
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""


          - name: cli-macos
            runner: ubuntu-latest
            goos: darwin
            goarch: amd64
            suffix: ""



          # ===================
          # GUI
          # ===================

          - name: gui-windows
            runner: windows-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"


          - name: gui-linux
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""


          - name: gui-macos
            runner: macos-latest
            goos: darwin
            goarch: amd64
            suffix: ""



    runs-on: ${{ matrix.runner }}



    steps:


      - uses: actions/checkout@v4



      - name: Setup Go
        uses: actions/setup-go@v5
        with:

          go-version: "1.21"

          cache: true

          cache-dependency-path: |
            CLI/go.sum
            GUI/go.sum



      # Linux Fyne dependencies

      - name: Linux OpenGL dependencies

        if: matrix.goos == 'linux'

        run: |

          sudo apt update

          sudo apt install -y \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libxxf86vm-dev



# ===================
# CLI BUILD
# ===================

      - name: Build CLI

        if: startsWith(matrix.name,'cli')

        shell: bash

        env:

          GOOS: ${{ matrix.goos }}

          GOARCH: ${{ matrix.goarch }}

          CGO_ENABLED: 0


        run: |

          cd CLI

          go build \
            -ldflags="-s -w" \
            -o adbpureflow-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            .



# ===================
# GUI BUILD
# ===================

      - name: Build GUI

        if: startsWith(matrix.name,'gui')


        shell: bash


        env:

          GOOS: ${{ matrix.goos }}

          GOARCH: ${{ matrix.goarch }}

          CGO_ENABLED: 1



        run: |

          cd GUI


          FLAGS="-s -w"


          if [ "${{ matrix.goos }}" = "windows" ]; then

            FLAGS="$FLAGS -H windowsgui"

          fi



          go build \
            -ldflags="$FLAGS" \
            -o adbpureflow-gui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            .



# ===================
# ARTIFACTS
# ===================


      - name: Upload CLI

        if: startsWith(matrix.name,'cli')

        uses: actions/upload-artifact@v4

        with:

          name: adbpureflow-cli-${{ matrix.goos }}-${{ matrix.goarch }}

          path: CLI/adbpureflow-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}



      - name: Upload GUI

        if: startsWith(matrix.name,'gui')

        uses: actions/upload-artifact@v4

        with:

          name: adbpureflow-gui-${{ matrix.goos }}-${{ matrix.goarch }}

          path: GUI/adbpureflow-gui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}



# =====================================
# RELEASE
# =====================================


  auto-release:

    name: Auto Release

    needs: multi-platform-build

    if: startsWith(github.ref,'refs/tags/v')

    runs-on: ubuntu-latest


    steps:


      - uses: actions/checkout@v4


      - name: Download artifacts

        uses: actions/download-artifact@v4

        with:

          path: dist



      - name: Prepare release

        run: |

          mkdir release-assets

          find dist -type f -name "adbpureflow-*" \
            -exec cp {} release-assets/ \;


      - name: Create Release

        uses: softprops/action-gh-release@v2

        with:

          files: release-assets/*

          generate_release_notes: true

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}