name: Apply Windows console popup fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'flessan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch process runner
        shell: python
        run: |
          from pathlib import Path

          app = Path("GUI/app.go")
          text = app.read_text(encoding="utf-8")

          replacements = [
              (
                  'cmd := exec.CommandContext(ctx, executable, args...)\n\tvar out, stderr bytes.Buffer',
                  'cmd := exec.CommandContext(ctx, executable, args...)\n\tconfigureCommand(cmd)\n\tvar out, stderr bytes.Buffer',
              ),
              (
                  'cmd := exec.CommandContext(ctx, executable, args...)\n\tcmd.Stdout = io.Discard',
                  'cmd := exec.CommandContext(ctx, executable, args...)\n\tconfigureCommand(cmd)\n\tcmd.Stdout = io.Discard',
              ),
              (
                  'cmd := exec.CommandContext(ctx, executable, args...)\n\tstdout, err := cmd.StdoutPipe()',
                  'cmd := exec.CommandContext(ctx, executable, args...)\n\tconfigureCommand(cmd)\n\tstdout, err := cmd.StdoutPipe()',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected source pattern not found: {old!r}")
              text = text.replace(old, new, 1)

          app.write_text(text, encoding="utf-8", newline="\n")

          Path("GUI/process_windows.go").write_text('''//go:build windows

package main

import (
    "os/exec"
    "syscall"
)

// configureCommand prevents console-based helper processes such as adb.exe
// from flashing a transient console window when launched by the GUI app.
func configureCommand(cmd *exec.Cmd) {
    cmd.SysProcAttr = &syscall.SysProcAttr{HideWindow: true}
}
''', encoding="utf-8", newline="\n")

          Path("GUI/process_other.go").write_text('''//go:build !windows

package main

import "os/exec"

// configureCommand is a no-op on platforms where console-window creation is
// not controlled by the Windows-specific process attributes.
func configureCommand(cmd *exec.Cmd) {}
''', encoding="utf-8", newline="\n")

      - name: Format changed Go files
        run: |
          gofmt -w GUI/app.go GUI/process_windows.go GUI/process_other.go

      - name: Verify
        working-directory: GUI
        run: go test ./...

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-console-popup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GUI/app.go GUI/process_windows.go GUI/process_other.go .github/workflows/fix-console-popup.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Windows helper console popups"
          git push origin HEAD:main
