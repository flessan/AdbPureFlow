name: Patch Windows console popup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('GUI/app.go')
          text = app.read_text(encoding='utf-8')
          if 'configureCommand(cmd)' in text:
              raise SystemExit('Popup fix is already applied')

          old = 'cmd := exec.CommandContext(ctx, executable, args...)'
          if text.count(old) != 3:
              raise SystemExit(f'expected 3 OSRunner command sites, found {text.count(old)}')
          text = text.replace(old, old + '\n\tconfigureCommand(cmd)', 3)

          capture = 'cmd := exec.CommandContext(ctx, adb, "-s", serial, "exec-out", "screencap", "-p")'
          if capture not in text:
              raise SystemExit('CaptureScreenshot command not found')
          text = text.replace(capture, capture + '\n\tconfigureCommand(cmd)', 1)
          app.write_text(text, encoding='utf-8')
          PY

          cd GUI
          gofmt -w app.go process_windows.go process_other.go process_windows_test.go
          go test .
          go vet .
          cd ..
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GUI/app.go GUI/process_windows.go GUI/process_other.go GUI/process_windows_test.go
          git rm .github/workflows/patch-console-popup.yml
          git commit -m 'Fix Windows console popup from helper processes'
          git push origin HEAD:main
